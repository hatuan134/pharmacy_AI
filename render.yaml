databases:
  - name: pharmacy-ai-v2-db
    plan: free

services:
  - type: web
    name: pharmacy-ai-v2
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-ai-v2-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
